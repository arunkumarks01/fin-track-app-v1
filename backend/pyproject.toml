[project]
name = "fintrack-backend"
version = "0.0.1"
description = "FinTrack v2 backend — single-process FastAPI + TimescaleDB"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "asyncpg>=0.30",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "defusedxml==0.7.1",
    "websockets==17.4",
    "pyarrow==26.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "DTZ", "PT"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# no upstream type stubs; isolated behind app.db / app.core.scheduler
module = ["asyncpg", "asyncpg.*", "apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# No stub package added for the approved RSS parser.
module = ["defusedxml", "defusedxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyarrow ships no type information (DEC-1D-DEPS); no stub package added
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "db: integration test against a real TimescaleDB (TEST_DATABASE_URL)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
